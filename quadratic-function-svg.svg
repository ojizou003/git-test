<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- グリッドの背景 -->
  <defs>
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#eee" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ccc" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- グラフの背景 -->
  <rect width="600" height="400" fill="white"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  
  <!-- 座標軸 -->
  <line x1="0" y1="200" x2="600" y2="200" stroke="black" stroke-width="2"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="black" stroke-width="2"/>
  
  <!-- x軸の目盛り -->
  <g font-size="12" text-anchor="middle">
    <text x="300" y="220">0</text>
    <text x="400" y="220">1</text>
    <text x="500" y="220">2</text>
    <text x="200" y="220">-1</text>
    <text x="100" y="220">-2</text>
    <text x="580" y="220">x</text>
  </g>
  
  <!-- y軸の目盛り -->
  <g font-size="12" text-anchor="end">
    <text x="295" y="200">0</text>
    <text x="295" y="100">1</text>
    <text x="295" y="300">-1</text>
    <text x="295" y="25">y</text>
  </g>
  
  <!-- 2次関数 y = x^2 の曲線 -->
  <path d="M 100 400 
           Q 200 200 300 200 
           Q 400 200 500 400" 
        fill="none" stroke="#4285F4" stroke-width="3"/>
  
  <!-- タイトル -->
  <text x="300" y="30" font-size="20" text-anchor="middle" font-weight="bold">2次関数: y = x²</text>
  
  <!-- 説明テキスト -->
  <text x="450" y="70" font-size="14" text-anchor="start">
    <tspan x="450" dy="0">y = x²</tspan>
    <tspan x="450" dy="20">放物線</tspan>
  </text>
</svg>